# Generated by tools/port/bmad_layers.py: work runs on Sonnet subagents. Do not edit.

[workflow]
implementation_handoff = '''
Launch a subagent with no prior conversation context with the Agent tool, subagent_type `general-purpose`, model `sonnet`. It runs in the background: arm a Monitor on `{project-root}/tools/port/agent-watch.sh` right after launching it (CLAUDE.md, "Operación de cada sesión", item 6) and wait for its completion notification. Its final message is the implementer's report. If it fails, report the error to the user and implement directly from the spec. Prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> Build and test inside the port image, never on the host toolchain: single commands and single-threaded captures with `tools/port/docker_run.sh`, parallel work (full `ctest -j`, several scenes, web and native builds together) with `tools/port/remote_run.sh` (`docs/port/setup.md`). Web (Playwright) suites need PulseAudio: run them locally with `DW_IMAGE=dw-port:remote tools/port/docker_run.sh`, keep clock-sensitive suites serial, and take final class B evidence with `tools/port/remote_run.sh`; both with `DW1_DISC_DIR=/dw/game_rom/extracted`. Ignore the session steps in CLAUDE.md (STATUS.md, sprint, commit and push): do not commit or push, and do not spawn subagents.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
'''

[[workflow.review_layers]]
id = "sonnet-merged"
name = "Blind Hunter + Verification Gap Reviewer + Edge Case Hunter (Sonnet)"
instruction = '''
First run this with the Bash tool:

awk '/^diff --git /{skip = $4 ~ "^b/docs/implementation-artifacts/"} !skip' {diff_file} > {diff_file}.code

Then launch a context-free subagent with the Agent tool, subagent_type `general-purpose`, model `sonnet`, launched in the same turn as the other layers, with the prompt below. Its final message has one section per review headed `## <layer id>`; treat each section as the findings of the layer with that id, verbatim. A failed subagent means all 3 layers failed; a missing or empty section means that layer failed.

Prompt:

You will run 3 independent reviews of the same change, in the order given. Finish each review before reading anything the next one points to, and do not let a later review's inputs change an earlier review's findings. Your final message has exactly one section per review, headed `## <id>`, containing that review's output. You are a reviewer: do not edit, write or delete files, and do not commit. Ignore the session steps in CLAUDE.md (STATUS.md, sprint, commit and push).

### Review 1: id `blind-hunter`

Conduct a review of CONTENT.
Look for what's missing, not only what's wrong.
Compute your finding floor N from the diff file's size: N = min(floor(sqrt(kB) + 1), 10), where kB is the file's size in kilobytes. State the arithmetic in one line, then find at least N issues to fix or improve.
Output a Markdown list of findings only — no severity, priority, or ranking.
If the content is empty, stop and say so.
If you have zero findings, re-check and keep thinking; do not stop with an empty list.

CONTENT: the unified diff at `{diff_file}.code`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

### Review 2: id `verification-gap`

Read `{skill-root}/review-prompts/verification-gap.md` completely and follow it as your review instructions.

Review content: the unified diff at `{diff_file}.code`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

### Review 3: id `edge-case-hunter`

Read `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.

claims_file (leave unread until your instructions call for it): {claims_file}

Review content: the unified diff at `{diff_file}.code`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
'''

