<!doctype html>
<meta charset="utf-8">
<title>DW1 development host</title>
<canvas id="canvas" width="320" height="240"></canvas>
<pre id="status"></pre>
<section id="launcher" hidden>
  <p>Commit: <span id="version">dev</span></p>
  <p id="pack-status">Pack ausente</p>
  <button id="load-pack" disabled>Cargar Pack</button>
  <button id="play" disabled>Jugar</button>
  <progress id="progress" hidden></progress>
</section>
<script>
const status = document.querySelector('#status');
if (!crossOriginIsolated) {
  status.textContent = 'cross-origin isolation required';
} else if (!location.search) {
  launch();
} else {
  const query = new URLSearchParams(location.search);
  var Module = {
    noInitialRun: true,
    canvas: document.querySelector('#canvas'),
    arguments: ['--frames', query.get('frames') || '1', ...(query.get('pattern') === '1' ? ['--pattern'] : []), ...(query.get('validate') === '1' ? ['--validate'] : [])],
    print: text => { console.log(text); status.textContent += text + '\n'; },
    printErr: text => { console.error(text); status.textContent += text + '\n'; }
  };
  if (query.has('pack')) Module.arguments.push('--pack', 'dw1/us.pack');
  if (query.has('io-test')) Module.arguments.push(query.get('io-test') === 'guard' ? '--io-guard-test' : '--io-test');
  if (query.has('capture-mark')) Module.arguments.push('--capture-mark', query.get('capture-mark'),
      '--capture-vblank', query.get('capture-vblank'));
  Module.onRuntimeInitialized = async () => {
    try {
      if (query.has('pack') || query.has('io-test')) {
        Module.ioWorker = new Worker('/io_worker.js');
        await new Promise((resolve, reject) => {
          Module.ioWorker.onmessage = ({data}) => data.ready ? resolve() : reject(Error(data.error));
          Module.ioWorker.onerror = e => reject(Error(e.message));
          Module.ioWorker.postMessage({memory: HEAPU8.buffer, address: Module._io_mailbox_address(),
            delay: query.has('io-test') ? 5 : 0});
        });
      }
      Module.callMain(Module.arguments);
    } catch (error) { Module.printErr(error.message); Module.finished = 1; }
  };
  if (query.get('validate') === '1') Module.presentations = [];
  const script = document.createElement('script');
  script.src = '/dw1.js' + (query.has('poison') ? '?poison=1' : '');
  document.head.append(script);
}
async function launch() {
  document.querySelector('#canvas').hidden = true;
  document.querySelector('#launcher').hidden = false;
  const state = document.querySelector('#pack-status');
  const load = document.querySelector('#load-pack');
  const play = document.querySelector('#play');
  const progress = document.querySelector('#progress');
  let expected;
  try {
    try {
      const version = await fetch('/version.txt');
      if (version.ok) document.querySelector('#version').textContent = (await version.text()).trim();
    } catch (_) { /* Keep the local development fallback. */ }
    const response = await fetch('/__fixture/us.pack.sha256');
    if (!response.ok) throw Error('Pack SHA-256 HTTP ' + response.status);
    expected = (await response.text()).trim();
    if (!/^[a-f0-9]{64}$/.test(expected)) throw Error('invalid Pack SHA-256');
    const root = await navigator.storage.getDirectory();
    try {
      const dir = await root.getDirectoryHandle('dw1');
      const pack = await (await dir.getFileHandle('us.pack')).getFile();
      let stored = '';
      try { stored = (await (await (await dir.getFileHandle('us.pack.sha256')).getFile()).text()).trim(); }
      catch (error) { if (error.name !== 'NotFoundError') throw error; }
      if (pack.size) {
        state.textContent = stored === expected ? 'Pack disponible' : 'Pack desactualizado';
        play.disabled = stored !== expected;
      }
    } catch (error) { if (error.name !== 'NotFoundError') throw error; }
    load.disabled = false;
  } catch (error) { status.textContent = error.message; load.disabled = true; }
  // ponytail: a finite run, because the game thread's OffscreenCanvas only shows a frame once the
  // thread returns to its event loop; an endless run stays blank. Continuous presentation is deferred.
  play.onclick = () => { location.href = '/?pack=1&frames=300'; };
  load.onclick = () => {
    load.disabled = true; play.disabled = true; progress.hidden = false;
    const worker = new Worker('/seed_worker.js');
    const finish = error => {
      worker.terminate(); load.disabled = false; progress.hidden = true;
      if (error) { status.textContent = error; state.textContent = 'Pack ausente'; }
      else { status.textContent = ''; state.textContent = 'Pack disponible'; play.disabled = false; }
    };
    worker.onmessage = ({data}) => {
      if (data.step) { status.textContent = data.step; return; }
      if (data.progress !== undefined) {
        status.textContent = data.progress + ' bytes';
        if (data.total) { progress.max = data.total; progress.value = data.progress; }
        return;
      }
      finish(data.error);
    };
    worker.onerror = e => finish(e.message);
    worker.postMessage({url:'/__fixture/us.pack', sha256:expected});
  };
}
</script>
