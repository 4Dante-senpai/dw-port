<!doctype html>
<meta charset="utf-8">
<title>DW1 development host</title>
<canvas id="canvas" width="320" height="240"></canvas>
<pre id="status"></pre>
<section id="launcher" hidden>
  <p>Commit: <span id="version">dev</span></p>
  <p id="pack-status">Pack ausente</p>
  <label id="drop-zone">Seleccionar o arrastrar el disco
    <input id="disc" type="file" disabled multiple accept=".bin,.cue">
  </label>
  <button id="clear" disabled>Borrar datos</button>
  <p id="storage-warning"></p>
  <button id="load-pack" hidden disabled>Cargar Pack</button>
  <button id="play" disabled>Jugar</button>
  <progress id="progress" hidden></progress>
</section>
<script>
const status = document.querySelector('#status');
if (!crossOriginIsolated) {
  status.textContent = 'cross-origin isolation required';
} else if (!location.search) {
  launch();
} else {
  const query = new URLSearchParams(location.search);
  var Module = {
    noInitialRun: true,
    canvas: document.querySelector('#canvas'),
    arguments: ['--frames', query.get('frames') || '1', ...(query.get('pattern') === '1' ? ['--pattern'] : []), ...(query.get('validate') === '1' ? ['--validate'] : [])],
    print: text => { console.log(text); status.textContent += text + '\n'; },
    printErr: text => { console.error(text); status.textContent += text + '\n'; }
  };
  if (query.has('pack')) Module.arguments.push('--pack', 'dw1/us.pack');
  if (query.has('io-test')) Module.arguments.push(query.get('io-test') === 'guard' ? '--io-guard-test' : '--io-test');
  if (query.has('capture-mark')) Module.arguments.push('--capture-mark', query.get('capture-mark'),
      '--capture-vblank', query.get('capture-vblank'));
  Module.onRuntimeInitialized = async () => {
    try {
      if (query.has('pack') || query.has('io-test')) {
        Module.ioWorker = new Worker('/io_worker.js');
        await new Promise((resolve, reject) => {
          Module.ioWorker.onmessage = ({data}) => data.ready ? resolve() : reject(Error(data.error));
          Module.ioWorker.onerror = e => reject(Error(e.message));
          Module.ioWorker.postMessage({memory: HEAPU8.buffer, address: Module._io_mailbox_address(),
            delay: query.has('io-test') ? 5 : 0});
        });
      }
      Module.callMain(Module.arguments);
    } catch (error) { Module.printErr(error.message); Module.finished = 1; }
  };
  if (query.get('validate') === '1') Module.presentations = [];
  const script = document.createElement('script');
  script.src = '/dw1.js' + (query.has('poison') ? '?poison=1' : '');
  document.head.append(script);
}
async function launch() {
  document.querySelector('#canvas').hidden = true;
  document.querySelector('#launcher').hidden = false;
  const state = document.querySelector('#pack-status');
  const load = document.querySelector('#load-pack');
  const play = document.querySelector('#play');
  const progress = document.querySelector('#progress');
  const disc = document.querySelector('#disc');
  const clear = document.querySelector('#clear');
  const warning = document.querySelector('#storage-warning');
  let expected, available = false;
  function request(data, onProgress) {
    return new Promise((resolve, reject) => {
      const worker = new Worker('/io_worker.js');
      worker.onmessage = ({data}) => {
        if (data.progress !== undefined) { onProgress?.(data); return; }
        worker.terminate();
        data.error ? reject(Error(data.error)) : resolve(data);
      };
      worker.onerror = e => { worker.terminate(); reject(Error(e.message)); };
      worker.postMessage(data);
    });
  }
  function busy(value) {
    disc.disabled = clear.disabled = value;
    load.disabled = value || !expected;
    play.disabled = value || !available;
    progress.hidden = !value;
    if (value) { progress.removeAttribute('value'); status.textContent = ''; }
  }
  async function select(files) {
    if (disc.disabled) return;
    busy(true);
    try {
      const response = await fetch('/us.tsv');
      if (!response.ok) throw Error('Manifest HTTP ' + response.status);
      await request({type:'build', files:Array.from(files), manifest:await response.text()}, data => {
        progress.max = data.total; progress.value = data.progress;
      });
      available = true;
      state.textContent = 'Listo para jugar';
      navigator.storage.persist().then(granted => {
        if (!granted) warning.textContent = 'Almacenamiento persistente denegado: el navegador puede borrar los datos.';
      }).catch(e => { warning.textContent = 'No se pudo solicitar almacenamiento persistente: ' + e.message; });
    } catch (e) { status.textContent = e.message; }
    finally { busy(false); disc.value = ''; }
  }
  disc.onchange = () => select(disc.files);
  const drop = document.querySelector('#drop-zone');
  drop.ondragover = e => e.preventDefault();
  drop.ondrop = e => { e.preventDefault(); select(e.dataTransfer.files); };
  clear.onclick = async () => {
    busy(true);
    try {
      await request({type:'clear'});
      available = false; state.textContent = 'Pack ausente'; warning.textContent = '';
    } catch (e) { status.textContent = e.message; }
    finally { busy(false); }
  };
  try {
    const stored = await request({type:'status'});
    available = !!stored.sha256;
    state.textContent = available ? 'Listo para jugar' : 'Pack ausente';
    play.disabled = !available;
    try {
      const version = await fetch('/version.txt');
      if (version.ok) document.querySelector('#version').textContent = (await version.text()).trim();
      const response = await fetch('/__fixture/us.pack.sha256');
      if (response.ok) {
        expected = (await response.text()).trim();
        if (!/^[a-f0-9]{64}$/.test(expected)) throw Error('invalid Pack SHA-256');
        load.hidden = false; load.disabled = false;
        if (available) {
          state.textContent = stored.sha256 === expected ? 'Pack disponible' : 'Pack desactualizado';
          available = stored.sha256 === expected;
          play.disabled = !available;
        }
      }
    } catch (_) { /* The fixture is optional on the user's host. */ }
  } catch (e) { status.textContent = e.message; }
  busy(false);
  // ponytail: a finite run, because the game thread's OffscreenCanvas only shows a frame once the
  // thread returns to its event loop; an endless run stays blank. Continuous presentation is deferred.
  play.onclick = () => { location.href = '/?pack=1&frames=300'; };
  load.onclick = () => {
    busy(true);
    const worker = new Worker('/seed_worker.js');
    const finish = error => {
      worker.terminate(); busy(false);
      if (error) { available = false; play.disabled = true; status.textContent = error; state.textContent = 'Pack ausente'; }
      else { available = true; status.textContent = ''; state.textContent = 'Pack disponible'; play.disabled = false; }
    };
    worker.onmessage = ({data}) => {
      if (data.step) { status.textContent = data.step; return; }
      if (data.progress !== undefined) {
        status.textContent = data.progress + ' bytes';
        if (data.total) { progress.max = data.total; progress.value = data.progress; }
        return;
      }
      finish(data.error);
    };
    worker.onerror = e => finish(e.message);
    worker.postMessage({url:'/__fixture/us.pack', sha256:expected});
  };
}
</script>
