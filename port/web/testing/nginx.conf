server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control no-store always;
    location = / { try_files /dw1.html =404; }
    location = /dw1.wasm { types { application/wasm wasm; } try_files $uri =404; }
    location = /index.html { try_files /dw1.html =404; }
    location = /__fixture/us.pack { alias /pack/us.pack; }
    location = /__fixture/us.pack.sha256 { alias /pack/us.pack.sha256; }
    location /__fixture/ { return 404; }
    location / { try_files $uri =404; }
}
